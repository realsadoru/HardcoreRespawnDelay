name: HardcoreRespawnDelay
version: '1.0.0'
main: com.example.hardcorerespawn.HardcoreRespawnDelay
api-version: '1.21'
author: Custom
description: Replaces permadeath in hardcore mode with a timed respawn delay (spectator + on-screen timer)

commands:
  hrd:
    description: Administrative commands for HardcoreRespawnDelay
    permission: hrd.admin
    usage: /hrd <reload|revive <player>|time <player>>

permissions:
  hrd.admin:
    description: Access to the plugin's administrative commands
    default: op
  hrd.bypass:
    description: A player with this permission respawns instantly, without delay
    default: op
