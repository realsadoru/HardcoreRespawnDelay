# =========================================================
#  HardcoreRespawnDelay - configuration
# =========================================================

# Whether the plugin is active.
enabled: true

# Respawn wait time, in seconds.
# 300 = 5 minutes
respawn-delay-seconds: 300

# Whether the waiting player is put into spectator mode
# (can fly and observe, but cannot interact with anything).
use-spectator-mode: true

# Whether to restrict flying in spectator mode to a small radius around the death/respawn point
# (the player can freely look around, but can't fly off to explore the map or scout ores through walls).
restrict-spectator-movement: true

# Radius (in blocks) the player can move within in spectator mode, if restrict-spectator-movement: true
spectator-movement-radius: 5.0

# Whether to show a large countdown title in the center of the screen while waiting.
show-title-timer: true

# How often (in seconds) to refresh the on-screen title (titles fade after a moment, so it needs refreshing).
title-refresh-interval-seconds: 1

# Whether to additionally show a persistent countdown in the action bar (small bar above the hotbar).
show-actionbar-timer: false

# Whether to play a sound to the player once their wait time is over.
play-sound-on-respawn-ready: true
sound-on-respawn-ready: "ENTITY_PLAYER_LEVELUP"

# Whether to broadcast a server-wide message when a player dies and starts waiting.
broadcast-death: true

# Whether to broadcast a server-wide message when a player returns to the game.
broadcast-return: true

# ---------------------------------------------------------
# Messages. Supported color codes: & (e.g. &c = red)
# Placeholders: {player}, {time}, {seconds}
# ---------------------------------------------------------
messages:
  death-broadcast: "&c☠ {player} died! They will be able to respawn in {time}."
  return-broadcast: "&a✔ {player} is back in the game!"

  title-main: "&c&lWAITING TO RESPAWN"
  title-subtitle: "&fYou can respawn in: &e&l{time}"

  title-ready-main: "&a&lYOU CAN RESPAWN NOW!"
  title-ready-subtitle: "&fPress any movement key"

  actionbar-waiting: "&7Respawn in: &e{time}"

  respawn-message: "&aYou're back in the game! Good luck."

  rejoin-still-waiting: "&eStill waiting to respawn: &6&l{time}"

  bypass-message: "&7(You have the hrd.bypass permission - you respawn instantly)"
