name: HardcoreRespawnDelay
version: '1.0.0'
main: com.example.hardcorerespawn.HardcoreRespawnDelay
api-version: '1.21'
author: Custom
description: Zamienia permadeath w hardcore mode na czasowy respawn delay (spectator + timer na ekranie)

commands:
  hrd:
    description: Komendy administracyjne HardcoreRespawnDelay
    permission: hrd.admin
    usage: /hrd <reload|revive <gracz>|time <gracz>>

permissions:
  hrd.admin:
    description: Dostęp do komend administracyjnych pluginu
    default: op
  hrd.bypass:
    description: Gracz z tym uprawnieniem odradza się natychmiast, bez opóźnienia
    default: op
